name: Android APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency: android-release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Build signed APK
        working-directory: android
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          for s in GOOGLE_SERVICES_JSON KEYSTORE_BASE64 KEYSTORE_PASSWORD; do
            [ -n "${!s}" ] || { echo "::error::Repository secret for $s is not set"; exit 1; }
          done
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          KEYSTORE_FILE="$RUNNER_TEMP/release.jks" ./gradlew --no-daemon assembleRelease
          VERSION="$(cat VERSION).$GITHUB_RUN_NUMBER"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/reoview-$VERSION.apk"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" "$RUNNER_TEMP/reoview-$VERSION.apk" \
            --title "Reoview $VERSION" --target "$GITHUB_SHA" \
            --notes "Android app $VERSION (versionCode $GITHUB_RUN_NUMBER), built from $GITHUB_SHA."
