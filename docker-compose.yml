# Every value can be set through environment variables (defaults after ":-").
# DATA_DIR / STORAGE_DIR are host folders; inside the container they are always /data and /storage.
services:
  reoview:
    build: .
    container_name: reoview
    restart: unless-stopped
    stop_grace_period: ${REOVIEW_STOP_GRACE:-30s}   # time for ffmpeg to send RTSP TEARDOWN on stop
    ports:
      - "${REOVIEW_PORT:-8000}:8000"
    environment:
      TZ: "${TZ:-Europe/Berlin}"                                  # time zone used for the alert schedule
      DATA_DIR: "/data"
      HLS_DIR: "/tmp/hls"
      STORAGE_ROOT: "/storage"
      REOVIEW_TRANSCODE: "${REOVIEW_TRANSCODE:-0}"                # 0 = copy camera stream, 1 = re-encode (640px, 15 fps)
      REOVIEW_SNAP_TYPE: "${REOVIEW_SNAP_TYPE:-sub}"              # alert photo: sub = fast, main = full resolution
      REOVIEW_COOLDOWN: "${REOVIEW_COOLDOWN:-30}"                 # seconds between alerts per camera and type
      REOVIEW_WEBHOOK_SECRET: "${REOVIEW_WEBHOOK_SECRET:-}"       # if set, webhooks must carry this secret
      REOVIEW_VAPID_SUB: "${REOVIEW_VAPID_SUB:-mailto:reoview@example.com}"
      REOVIEW_MIN_VIDEO_KB: "${REOVIEW_MIN_VIDEO_KB:-500}"
      REOVIEW_VIDEO_WAIT_S: "${REOVIEW_VIDEO_WAIT_S:-300}"
      REOVIEW_VIDEO_SETTLE_S: "${REOVIEW_VIDEO_SETTLE_S:-10}"
      REOVIEW_RESOLVED_DAYS: "${REOVIEW_RESOLVED_DAYS:-7}"
      REOVIEW_MAX_ALERT_GB: "${REOVIEW_MAX_ALERT_GB:-3}"
      REOVIEW_AUTO_REBOOT: "${REOVIEW_AUTO_REBOOT:-0}"            # 1 = reboot a camera whose RTSP stays refused while its HTTP API answers
      REOVIEW_REBOOT_AFTER: "${REOVIEW_REBOOT_AFTER:-5}"          # consecutive failed restarts before a reboot
      REOVIEW_REBOOT_COOLDOWN_MIN: "${REOVIEW_REBOOT_COOLDOWN_MIN:-60}"
      REOVIEW_APK_REPO: "${REOVIEW_APK_REPO:-lyvielle/reoview}"       # GitHub repo whose releases provide the Android app
      REOVIEW_APK_CHECK_H: "${REOVIEW_APK_CHECK_H:-6}"            # hours between release checks, 0 = off
    volumes:
      - ${DATA_DIR:-./data}:/data
      - ${STORAGE_DIR:-/media/reolink}:/storage
    tmpfs:
      - /tmp/hls
